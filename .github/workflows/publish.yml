name: Publish to npm

# Publishes to npm (public, anyone can install) with npm trusted publishing:
# GitHub Actions proves to npm which repository and workflow is publishing
# (OIDC), so no long-lived npm token is needed. Set it up once on npmjs.com:
# package Settings → Trusted publishing → GitHub Actions, with repository
# MohamedAbdElNaby/liquid and workflow publish.yml.
#
# Until that is set up, a NPM_TOKEN repository secret still works. npm stops
# accepting tokens that bypass 2FA for publishing around January 2027.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      npm:
        description: Publish to npm
        type: boolean
        default: true

permissions:
  contents: read
  # Lets npm verify this workflow (trusted publishing) and sign provenance.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Use an npm with trusted publishing
        # Trusted publishing needs npm 11.5.1 or later.
        run: |
          if ! npx -y semver -r ">=11.5.1" "$(npm --version)" > /dev/null; then
            npm install -g npm@11
          fi
          npm --version

      - name: Build
        run: yarn prepare

      - name: Publish to npm
        if: ${{ github.event_name == 'release' || inputs.npm }}
        run: |
          USERCONFIG="$RUNNER_TEMP/npm.npmrc"
          echo "registry=https://registry.npmjs.org/" > "$USERCONFIG"
          # Fallback while trusted publishing is not set up yet.
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" >> "$USERCONFIG"
          fi
          npm publish --access public --provenance --ignore-scripts --userconfig "$USERCONFIG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
