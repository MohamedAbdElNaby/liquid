name: Publish to npm

# Publishes to npm (public, anyone can install).
# Needs a repository secret named NPM_TOKEN (an npm Automation token).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      npm:
        description: Publish to npm
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build
        run: yarn prepare

      - name: Publish to npm
        if: ${{ github.event_name == 'release' || inputs.npm }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Add an npm Automation token as the NPM_TOKEN repository secret."
            exit 1
          fi
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "$RUNNER_TEMP/npm.npmrc"
          npm publish --access public --registry https://registry.npmjs.org --provenance --ignore-scripts --userconfig "$RUNNER_TEMP/npm.npmrc"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
